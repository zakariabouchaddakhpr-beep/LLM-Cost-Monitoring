services:
  llm-monitor:
    build: .
    container_name: llm-monitor
    env_file:
      - .env
    environment:
      # Inside the container, DuckDB should write to the mounted volume
      - DUCKDB_PATH=/app/results/llm_traces.duckdb
    volumes:
      # Persist results (JSON logs + DuckDB) on the host even after container exits
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import duckdb; duckdb.connect('/app/results/llm_traces.duckdb')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  streamlit:
    build: .
    container_name: llm-monitor-dashboard
    command: ["streamlit", "run", "streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    env_file:
      - .env
    volumes:
      - ./results:/app/results
    ports:
      - "8501:8501"
    depends_on:
      - llm-monitor
    restart: unless-stopped
